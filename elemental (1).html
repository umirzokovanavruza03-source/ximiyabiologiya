<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02060a">
<title>ЭЛЕМЕНТАЛЬ — путешествие от леса до кварка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
@property --accent { syntax: '<color>'; inherits: true; initial-value: #ffd27a; }
@property --angle  { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

:root {
  --accent: #ffd27a;
  --fx: .66; --fy: .5;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --glass: color-mix(in oklab, #04100f 48%, transparent);
  transition: --accent .9s ease;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden; background: #02060a; color: #eaf6f1;
  font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior: none; touch-action: none;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ---------- stage ---------- */
#stage { position: fixed; inset: 0; height: 100dvh; }
.scene { position: absolute; inset: 0; visibility: hidden; }
.art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; will-change: opacity, filter; }
.copy {
  position: absolute; inset: 0; display: flex; align-items: center;
  padding: 0 clamp(24px, 7vw, 130px) 0 clamp(60px, 8vw, 150px);
  pointer-events: none; transform-origin: 20% 50%; will-change: transform, opacity, filter;
}
.card {
  position: relative; max-width: min(560px, 100%); padding: clamp(22px, 2.6vw, 38px);
  border-radius: 28px; background: var(--glass);
  backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%);
  box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 30px 80px -30px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12);
}
.card::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
  background: conic-gradient(from var(--angle), transparent 0 62%, var(--accent) 82%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: spin 6s linear infinite;
}
@keyframes spin { to { --angle: 360deg; } }

.tag {
  display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
  font: 500 .72rem/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .2em; text-transform: uppercase; color: var(--accent);
}
.tag .num { padding: .5em .7em; border: 1px solid color-mix(in oklab, var(--accent) 55%, transparent); border-radius: 99px; }
.title {
  font-weight: 800; font-size: clamp(1.9rem, 4vw, 3.3rem); line-height: 1.04; letter-spacing: -.03em;
  text-wrap: balance; margin-bottom: 20px;
}
.w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .14em; margin-bottom: -.14em; }
.w.acc { color: var(--accent); text-shadow: 0 0 40px color-mix(in oklab, var(--accent) 60%, transparent); }
.c { display: inline-block; transform: translateY(108%) rotate(7deg); transition: transform .35s ease; }
.scene.on .c { transform: none; transition: transform 1.1s var(--ease); transition-delay: calc(.45s + var(--i) * 26ms); }
.body { font-size: clamp(.95rem, 1.15vw, 1.08rem); line-height: 1.6; color: rgba(234,246,241,.78); max-width: 46ch; text-wrap: pretty; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.chips span {
  font: 400 .72rem/1 'JetBrains Mono', ui-monospace, monospace; padding: .65em 1em; border-radius: 99px;
  border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05); color: rgba(234,246,241,.85);
}
.rv { opacity: 0; transform: translateY(18px); filter: blur(6px); transition: opacity .3s, transform .3s, filter .3s; }
.scene.on .rv { opacity: 1; transform: none; filter: none; transition: opacity .9s var(--ease), transform .9s var(--ease), filter .9s var(--ease); transition-delay: calc(.7s + var(--d, 0) * 110ms); }
.cta {
  position: relative; margin-top: 26px; padding: 15px 26px; border-radius: 99px; pointer-events: auto;
  background: var(--accent); color: #06130e; font-weight: 700; letter-spacing: .02em;
  box-shadow: 0 10px 40px -10px var(--accent); transition: transform .4s var(--ease), box-shadow .4s;
}
.cta:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 16px 60px -8px var(--accent); }

/* ---------- HUD ---------- */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; padding: 22px clamp(20px, 3.4vw, 48px); pointer-events: none; }
.brand { display: flex; align-items: center; gap: 14px; font-weight: 700; letter-spacing: .38em; font-size: .8rem; }
.logo { position: relative; width: 28px; height: 28px; }
.logo i { position: absolute; inset: 0; border: 1.5px solid var(--accent); border-radius: 50%; transform: rotate(var(--r)) scaleY(.38); }
.logo i:nth-child(1) { --r: 0deg; } .logo i:nth-child(2) { --r: 60deg; } .logo i:nth-child(3) { --r: 120deg; }
.logo::after { content: ''; position: absolute; inset: 50% auto auto 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
.logo { animation: spin2 12s linear infinite; } @keyframes spin2 { to { transform: rotate(360deg); } }
#read { text-align: right; font: 500 1.35rem/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: -.02em; }
#read small { display: block; margin-top: 8px; font-size: .62rem; letter-spacing: .22em; text-transform: uppercase; opacity: .55; }
#read sup { font-size: .6em; color: var(--accent); }

#dots { position: fixed; z-index: 20; left: clamp(14px, 2.2vw, 34px); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
#dots button { display: flex; align-items: center; gap: 14px; padding: 7px 4px; }
#dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.45); transition: all .6s var(--ease); }
#dots span { font: 500 .66rem/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; opacity: 0; transform: translateX(-8px); transition: all .5s var(--ease); white-space: nowrap; }
#dots button:hover span, #dots button.act span { opacity: .85; transform: none; }
#dots button.act i { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 16px var(--accent); transform: scale(1.35); }
#dots button.act span { color: var(--accent); }

#ruler { position: fixed; z-index: 20; right: clamp(14px, 2.4vw, 36px); top: 50%; width: 70px; height: 260px; transform: translateY(-50%); pointer-events: none;
  -webkit-mask-image: linear-gradient(transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(transparent, #000 25%, #000 75%, transparent); }
#ruler .strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
#ruler .tk { position: absolute; right: 0; height: 1px; width: 14px; background: rgba(255,255,255,.35); }
#ruler .tk b { position: absolute; right: 22px; top: -6px; font: 400 .62rem/1 'JetBrains Mono', ui-monospace, monospace; color: rgba(255,255,255,.5); white-space: nowrap; font-weight: 400; }
#ruler .mk { position: absolute; right: 0; top: 50%; width: 34px; height: 2px; background: var(--accent); box-shadow: 0 0 14px var(--accent); }

#prog { position: fixed; left: 0; bottom: 0; height: 3px; width: 0; z-index: 20; background: linear-gradient(90deg, transparent, var(--accent)); box-shadow: 0 0 20px var(--accent); }
#next { position: fixed; z-index: 20; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px;
  font: 500 .64rem/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .26em; text-transform: uppercase; color: rgba(255,255,255,.8); transition: opacity .6s, transform .6s var(--ease); }
#next .ring { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); display: grid; place-items: center; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: rgba(255,255,255,.05); animation: bob 2.4s ease-in-out infinite; transition: border-color .4s, background .4s; }
#next:hover .ring { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 22%, transparent); }
#next svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#next.hide { opacity: 0; pointer-events: none; transform: translate(-50%, 20px); }
#next .lbl { transition: opacity .5s; } #next.sub .lbl { opacity: 0; }
@keyframes bob { 50% { transform: translateY(6px); } }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 11; pointer-events: none; mix-blend-mode: screen; }
#flash { position: fixed; inset: 0; z-index: 12; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(circle at calc(var(--fx) * 100%) calc(var(--fy) * 100%), rgba(225,255,245,.95), rgba(120,220,255,.28) 26%, transparent 60%); }
.grain { position: fixed; inset: -50%; z-index: 14; pointer-events: none; opacity: .09; mix-blend-mode: overlay; animation: grain 1.2s steps(6) infinite;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
@keyframes grain { 0% { transform: translate(0,0); } 20% { transform: translate(-4%,3%); } 40% { transform: translate(3%,-5%); } 60% { transform: translate(-5%,-2%); } 80% { transform: translate(4%,4%); } 100% { transform: translate(0,0); } }
.vig { position: fixed; inset: 0; z-index: 13; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55)); }
#cursor { position: fixed; z-index: 15; left: 0; top: 0; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen; opacity: .55;
  background: radial-gradient(circle, color-mix(in oklab, var(--accent) 26%, transparent), transparent 62%); will-change: transform; }

#boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #02060a; transition: opacity 1s ease .1s, visibility 0s 1.1s; }
#boot.gone { opacity: 0; visibility: hidden; }
.boot-in { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.boot-logo { font-weight: 700; letter-spacing: .6em; margin-right: -.6em; font-size: clamp(1.1rem, 3vw, 1.8rem); animation: pulse 1.6s ease-in-out infinite; }
.boot-sub { font: 400 .68rem/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .3em; text-transform: uppercase; opacity: .5; }
.boot-bar { width: 200px; height: 2px; background: rgba(255,255,255,.12); overflow: hidden; border-radius: 2px; }
.boot-bar i { display: block; height: 100%; width: 0; background: #ffd27a; animation: load 1.3s var(--ease) forwards; }
@keyframes load { to { width: 100%; } } @keyframes pulse { 50% { opacity: .45; } }

@media (max-width: 820px) {
  .copy { align-items: flex-end; padding: 0 14px calc(104px + env(safe-area-inset-bottom)) 38px; }
  .card { padding: 20px; border-radius: 22px; max-width: none; }
  .title { font-size: clamp(1.55rem, 7.2vw, 2.2rem); margin-bottom: 12px; }
  .body { font-size: .92rem; line-height: 1.5; }
  .chips { margin-top: 14px; } .chips span:nth-child(n+3) { display: none; }
  #ruler, #dots span { display: none; }
  #dots { left: 10px; gap: 2px; } #read { font-size: 1.05rem; } .brand { letter-spacing: .26em; }
  #next { bottom: calc(18px + env(safe-area-inset-bottom)); gap: 8px; } #next .lbl { letter-spacing: .16em; font-size: .58rem; }
  .top { padding-top: calc(16px + env(safe-area-inset-top)); }
  #dots button { padding: 9px 6px; }
}
@media (pointer: coarse) { #cursor { display: none; } .grain { animation: none; inset: 0; opacity: .06; } .card { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); } }
@media (max-width: 820px) and (max-height: 720px) { .chips { display: none; } .body { font-size: .86rem; line-height: 1.45; } .copy { padding-bottom: calc(92px + env(safe-area-inset-bottom)); } .card { padding: 16px 18px; } .tag { margin-bottom: 10px; } }
@media (min-width: 821px) and (max-height: 520px) { .card { max-width: min(430px, 48vw); padding: 16px 20px; } .title { font-size: clamp(1.4rem, 3.2vw, 2rem); margin-bottom: 10px; } .body { font-size: .82rem; line-height: 1.45; } .chips { display: none; } .tag { margin-bottom: 10px; } #ruler { display: none; } #next { bottom: 12px; } #next .lbl { display: none; } #next .ring { width: 38px; height: 38px; } }
@media (prefers-reduced-motion: reduce) { .grain, .card::before, .logo, #next .ring { animation: none; } #fx { display: none; } }
</style>
</head>
<body>

<div id="boot"><div class="boot-in"><span class="boot-logo">ЭЛЕМЕНТАЛЬ</span><div class="boot-bar"><i></i></div><span class="boot-sub">калибровка микроскопа</span></div></div>

<main id="stage"></main>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div class="vig"></div>
<div class="grain"></div>
<div id="cursor"></div>

<header class="top">
  <div class="brand"><span class="logo"><i></i><i></i><i></i></span>ЭЛЕМЕНТАЛЬ</div>
  <div id="read"><span id="readv"></span><small id="readn"></small></div>
</header>
<nav id="dots" aria-label="Сцены"></nav>
<aside id="ruler" aria-hidden="true"><div class="strip" id="strip"></div><div class="mk"></div></aside>
<div id="prog"></div>
<button id="next" aria-label="Приблизить"><span class="ring"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span><span class="lbl" id="nextl">Листайте, чтобы приблизить</span></button>

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;
const BLURK = coarse ? .55 : 1;

let W = 0, H = 0, DPR = 1, mobile = false;
const F = { x: .66, y: .5 };
const mouse = { x: 0, y: 0, tx: 0, ty: 0 };

/* ================= content ================= */
const DATA = [
  { key: 'Лес',    tag: 'Экосистема', acc: '#ffd27a', scale: 1,   name: 'лес',      title: 'Всё живое начинается со <b>света</b>.',
    body: 'Лес вдыхает солнечный свет и выдыхает воздух, которым мы дышим. Выберите один листок и продолжайте падать вглубь.',
    chips: ['≈ 3 трлн деревьев', 'Свет → сахар'] },
  { key: 'Лист',   tag: 'Орган',      acc: '#b6ff6a', scale: -2,  name: 'лист',     title: 'Лист — это <b>солнечная</b> фабрика.',
    body: 'Жилки несут воду внутрь и сахар наружу, а микроскопические поры, устьица, открываются и закрываются, обменивая углекислый газ на кислород.',
    chips: ['100–1000 устьиц / мм²', 'Жилки = водопровод'] },
  { key: 'Клетка', tag: 'Клетка',     acc: '#5cf2c8', scale: -5,  name: 'клетка',   title: 'Внутри — город <b>хлоропластов</b>.',
    body: 'В каждой клетке зелёные органеллы ловят фотоны и собирают из воды и CO₂ глюкозу, топливо почти всей жизни.',
    chips: ['6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂', 'Хлоропласт ≈ 5 мкм'] },
  { key: 'ДНК',    tag: 'Молекула',   acc: '#c08bff', scale: -9,  name: 'молекула', title: 'Четыре буквы пишут <b>всё</b> живое.',
    body: 'В ядре ДНК свивается в двойную спираль из букв A, T, C и G. Она всего около двух нанометров в ширину, но хранит всю инструкцию.',
    chips: ['≈ 2 нм в ширину', 'A–T · C–G', '≈ 3 млрд букв'] },
  { key: 'Атом',   tag: 'Атом',       acc: '#5ad1ff', scale: -10, name: 'атом',     title: 'Углерод — атом <b>жизни</b>.',
    body: 'Шесть протонов, шесть нейтронов, шесть электронов. Четыре внешних электрона позволяют углероду собираться в цепи, кольца и механизмы биологии.',
    chips: ['Z = 6', '4 валентных электрона', 'Связь = общие электроны'] },
  { key: 'Кварки', tag: 'Ядро',       acc: '#ff6b9a', scale: -15, name: 'протон',   title: 'Здесь, внизу, — <b>кварки</b> и глюоны.',
    body: 'Протон — это три кварка, связанные сильным взаимодействием, и большая часть его массы — энергия этой связи. Биология — это химия. Химия — это физика. И всё начинается здесь.',
    chips: ['3 кварка в протоне', '≈ 1 фм', 'Сильное взаимодействие'], cta: 'Отдалиться ↺' }
];
const N = DATA.length;

/* ================= DOM build ================= */
function splitTitle(html) {
  const tmp = document.createElement('div'); tmp.innerHTML = html;
  const frag = document.createDocumentFragment(); let ci = 0;
  const add = (text, acc) => text.split(/(\s+)/).forEach(tok => {
    if (!tok) return;
    if (/^\s+$/.test(tok)) { frag.appendChild(document.createTextNode(' ')); return; }
    const w = document.createElement('span'); w.className = 'w' + (acc ? ' acc' : '');
    for (const ch of tok) { const c = document.createElement('span'); c.className = 'c'; c.style.setProperty('--i', ci++); c.textContent = ch; w.appendChild(c); }
    frag.appendChild(w);
  });
  tmp.childNodes.forEach(n => add(n.textContent, n.nodeType !== 3));
  return frag;
}

const stage = $('#stage');
const scenes = DATA.map((d, i) => {
  const el = document.createElement('section');
  el.className = 'scene'; el.style.setProperty('--accent', d.acc);
  el.innerHTML = `<canvas class="art"></canvas><div class="copy"><div class="card">
    <div class="tag rv" style="--d:0"><span class="num">0${i + 1}</span><span>${d.tag}</span></div>
    <h2 class="title"></h2>
    <p class="body rv" style="--d:1">${d.body}</p>
    <div class="chips rv" style="--d:2">${d.chips.map(c => `<span>${c}</span>`).join('')}</div>
    ${d.cta ? `<button class="cta rv" style="--d:3" data-restart>${d.cta}</button>` : ''}
  </div></div>`;
  $('.title', el).appendChild(splitTitle(d.title));
  stage.appendChild(el);
  const cv = $('.art', el);
  return { el, cv, ctx: cv.getContext('2d'), copy: $('.copy', el), vis: false };
});

const dotsEl = $('#dots');
const dots = DATA.map((d, i) => {
  const b = document.createElement('button');
  b.setAttribute('aria-label', d.key);
  b.innerHTML = `<i></i><span>${d.key}</span>`;
  b.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(b); return b;
});

/* ruler ticks: exponents 2 .. -16 */
const strip = $('#strip');
const PX = 16;
for (let k = 2; k >= -16; k--) {
  const t = document.createElement('div'); t.className = 'tk'; t.style.top = ((2 - k) * PX) + 'px';
  if (k % 3 === 0 || k === 1 || k === -2 || k === -5 || k === -9 || k === -10 || k === -15) t.innerHTML = `<b>10${sup(k)}</b>`;
  strip.appendChild(t);
}
function sup(n) {
  const m = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
  return String(n).split('').map(c => m[c]).join('');
}

/* ================= sprites ================= */
function ball(rgb, size = 96) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'); const r = size / 2;
  const [R, G, B] = rgb; const d = f => `${R * f | 0},${G * f | 0},${B * f | 0}`;
  const gr = g.createRadialGradient(r * .68, r * .62, r * .03, r, r, r);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(.16, `rgba(${R},${G},${B},1)`);
  gr.addColorStop(.58, `rgba(${d(.55)},1)`);
  gr.addColorStop(.82, `rgba(${d(.28)},.85)`);
  gr.addColorStop(1, `rgba(${d(.2)},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
function glowSprite(rgb, size = 128) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'); const r = size / 2;
  const gr = g.createRadialGradient(r, r, 0, r, r, r);

        ph: r() * TAU, nx: r() * TAU,

  render(ctx, t, s) {

/* ================= SCENE 3 — DNA ================= */
const BASE = ['#ff5d8f', '#ffb347', '#4ad8ff', '#8cff6b']; // A T C G
const S3 = {
  init() {
    const r = rng(11), m = Math.min(W, H), hy = Math.hypot(W, H);

    this.parts = Array.from({ length: 70 }, () => ({ x: r(), y: r(), r: .8 + r() * 2.2, v: .2 + r() * .6, ph: r() * TAU }));
    const mk = (cx, cy, len, ang, rad, spd, al, ph, k) => ({ cx, cy, len, ang, rad, spd, al, ph, k, turns: len / (rad * 5.2), N: Math.max(24, Math.round(len / (rad * .23))) });
    this.hel = [
      mk(W * .08, H * .85, hy * .9, -.55, m * .045, .5, .3, 2, .6),
      mk(W * .95, H * .1, hy * .9, .75, m * .05, -.45, .28, 4, .6),
      mk(F.x * W, F.y * H, hy * 1.05, -1.0, m * .105, .7, 1, 0, 1)

  },
  helix(ctx, t, o) {
    const N = o.N, ca = Math.cos(o.ang), sa = Math.sin(o.ang), nx = -sa, ny = ca, P = [], items = [];
    for (let i = 0; i < N; i++) {
      const u = i / (N - 1) - .5, ax = u * o.len, ph = u * o.turns * TAU + t * o.spd + o.ph;
      const c = Math.cos(ph) * o.rad, z = Math.sin(ph) * o.rad, k1 = 1 + z / (o.rad * 6), k2 = 1 - z / (o.rad * 6);
      const bx = o.cx + ax * ca, by = o.cy + ax * sa;
      P.push({ x1: bx + nx * c * k1, y1: by + ny * c * k1, x2: bx - nx * c * k2, y2: by - ny * c * k2, z, k1, k2 });

    }

      const p = P[i];

        ctx.globalAlpha = o.al * (.5 + .5 * (zz / o.rad * .5 + .5));

      }

  },
  render(ctx, t, s) {
    const fx = F.x * W, fy = F.y * H;
    const bg = ctx.createRadialGradient(fx, fy, 0, fx, fy, Math.hypot(W, H) * .7);
    bg.addColorStop(0, '#241352'); bg.addColorStop(.55, '#0e0830'); bg.addColorStop(1, '#04021a');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.save(); zoomT(ctx, s); ctx.translate(mouse.x * -10, mouse.y * -8);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .55;

      ctx.fillStyle = `rgba(200,170,255,${.15 + .4 * Math.abs(Math.sin(t * p.v + p.ph))})`; ctx.beginPath(); ctx.arc(x, y, p.r, 0, TAU); ctx.fill();

/* ================= SCENE 4 — atom ================= */

  render(ctx, t, s) {

    bg.addColorStop(0, '#0a2a4a'); bg.addColorStop(.5, '#061629'); bg.addColorStop(1, '#02060f');

/* ================= SCENE 5 — quarks ================= */

    // warped spacetime

    sg.addColorStop(0, 'rgba(255,255,255,.10)'); sg.addColorStop(.6, 'rgba(150,120,255,.10)'); sg.addColorStop(.92, 'rgba(120,200,255,.3)'); sg.addColorStop(1, 'rgba(120,200,255,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0, 0, Rp * 1.08, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(200,225,255,.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, Rp, 0, TAU); ctx.stroke();

    for (const f of this.foam) {

    }
    ctx.globalAlpha = 1;
    // quarks
    const Q = [0, 1, 2].map(i => {
      const a = t * .9 + i * TAU / 3 + .5 * Math.sin(t * .8 + i * 2), d = Rp * .5 * (1 + .15 * Math.sin(t * 1.3 + i)), z = Math.sin(t * .7 + i * 2.1);

        ctx.lineWidth = lw; ctx.strokeStyle = `rgba(255,240,200,${al})`; ctx.beginPath();
        for (let k = 0; k <= 40; k++) {
          const u = k / 40, off2 = Math.sin(u * Math.PI) * Rp * .05 * Math.sin(u * 20 - t * 8);
          const x = A.x + dx * u + nx * off2, y = A.y + dy * u + ny * off2; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.stroke();
      }
    }
    for (let i = 0; i < 3; i++) {
      const q = Q[i], k = 1 + q.z * .18, gs = Rp * .9 * k;
      ctx.globalAlpha = .7; ctx.drawImage(this.gq[i], q.x - gs / 2, q.y - gs / 2, gs, gs);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    Q.map((q, i) => ({ q, i })).sort((a, b) => a.q.z - b.q.z).forEach(({ q, i }) => {
      const sz = Rp * .36 * (1 + q.z * .18); ctx.drawImage(this.q[i], q.x - sz / 2, q.y - sz / 2, sz, sz);
    });
    ctx.restore();
  }
};

const SC = [S0, S1, S2, S3, S4, S5];

/* ================= FX: warp streaks ================= */
const fx = $('#fx'), fctx = fx.getContext('2d');
const streaks = (() => { const r = rng(99); return Array.from({ length: 170 }, () => ({ a: r() * TAU, r: r(), v: .5 + r() * 1.4, l: .05 + r() * .22, c: r() < .5 })); })();
function drawFx(speed, dt) {
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0); fctx.clearRect(0, 0, W, H);
  const k = smooth(.08, 1.3, speed); if (k < .01) return;
  const cx = F.x * W, cy = F.y * H, maxR = Math.hypot(W, H) * .75;
  fctx.lineCap = 'round';
  for (const s of streaks) {
    s.r += dt * s.v * (.2 + k * 2.4); if (s.r > 1) s.r = .02 + Math.random() * .05;
    const r1 = s.r * maxR, r0 = Math.max(8, r1 - s.l * maxR * (.3 + k)), ca = Math.cos(s.a), sa = Math.sin(s.a);
    fctx.strokeStyle = s.c ? `rgba(170,235,255,${k * .55 * s.r})` : `rgba(255,255,255,${k * .4 * s.r})`;
    fctx.lineWidth = .6 + s.r * 2.2; fctx.beginPath(); fctx.moveTo(cx + ca * r0, cy + sa * r0); fctx.lineTo(cx + ca * r1, cy + sa * r1); fctx.stroke();
  }
}

/* ================= resize ================= */
const root = document.documentElement;
function resize() {
  W = innerWidth; H = innerHeight; mobile = W < 820;
  DPR = Math.min(devicePixelRatio || 1, (mobile || coarse) ? 1.5 : (W * H > 1.6e6 ? 1.35 : 1.75));
  F.x = mobile ? .5 : .66; F.y = mobile ? .33 : .5;
  root.style.setProperty('--fx', F.x); root.style.setProperty('--fy', F.y);
  scenes.forEach(sc => { sc.cv.width = Math.round(W * DPR); sc.cv.height = Math.round(H * DPR); });
  fx.width = Math.round(W * DPR); fx.height = Math.round(H * DPR);
  SC.forEach(s => s.init());
}
let rz, lw = innerWidth, lh = innerHeight;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const dw = Math.abs(innerWidth - lw), dh = Math.abs(innerHeight - lh); if (coarse && dw < 2 && dh < 150) return; lw = innerWidth; lh = innerHeight; resize(); }, 160); });

/* ================= navigation ================= */
let pos = -.3, from = -.3, to = 0, t0 = 0, dur = 1, tweening = false, index = 0, lockUntil = 0, started = false;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const nextBtn = $('#next'), nextL = $('#nextl');
nextL.textContent = coarse ? 'Свайп вверх' : 'Листайте, чтобы приблизить';

function setActive(i) {
  scenes.forEach((s, k) => s.el.classList.toggle('on', k === i));
  dots.forEach((d, k) => d.classList.toggle('act', k === i));
  root.style.setProperty('--accent', DATA[i].acc);
  nextBtn.classList.toggle('hide', i === N - 1);
  nextBtn.classList.toggle('sub', i > 0);
}
function startTween(target, ms) { from = pos; to = target; t0 = performance.now(); dur = ms; tweening = true; }
function goTo(i) {
  if (!started) return;
  i = clamp(Math.round(i), 0, N - 1); if (i === index && !tweening) return;
  const steps = Math.abs(i - pos);
  index = i; setActive(i);
  startTween(i, reduce ? 450 : Math.min(3800, 1800 + 380 * (steps - 1)));
  lockUntil = performance.now() + dur * .78;
}
const canNav = () => performance.now() > lockUntil;
const step = d => { if (canNav()) goTo(index + d); };

addEventListener('wheel', e => {
  e.preventDefault();
  const now = performance.now();
  if (!canNav() || tweening && now < lockUntil) { lockUntil = Math.max(lockUntil, now + 140); return; }
  if (Math.abs(e.deltaY) < 8) return;
  step(e.deltaY > 0 ? 1 : -1);
}, { passive: false });
addEventListener('keydown', e => {
  if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); step(1); }
  else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); step(-1); }
  else if (e.key === 'Home') goTo(0); else if (e.key === 'End') goTo(N - 1);
});
let ty0 = null;
addEventListener('touchstart', e => { ty0 = e.touches[0].clientY; }, { passive: true });
addEventListener('touchmove', e => e.preventDefault(), { passive: false });
addEventListener('touchend', e => {
  if (ty0 === null) return; const dy = ty0 - e.changedTouches[0].clientY; ty0 = null;
  if (Math.abs(dy) > 40) step(dy > 0 ? 1 : -1);
}, { passive: true });
nextBtn.addEventListener('click', () => step(1));
stage.addEventListener('click', e => { if (e.target.closest('[data-restart]')) goTo(0); });
addEventListener('pointermove', e => { mouse.tx = (e.clientX / W - .5) * 2; mouse.ty = (e.clientY / H - .5) * 2; cur.tx = e.clientX; cur.ty = e.clientY; });
const cur = { x: innerWidth / 2, y: innerHeight / 2, tx: innerWidth / 2, ty: innerHeight / 2 }, curEl = $('#cursor');

/* ================= HUD ================= */
const EXPS = DATA.map(d => d.scale);
const expAt = p => { p = clamp(p, 0, N - 1); const i = Math.min(N - 2, Math.floor(p)), f = p - i; return lerp(EXPS[i], EXPS[i + 1], ease(f)); };
const readv = $('#readv'), readn = $('#readn'), prog = $('#prog'), flash = $('#flash');
let lastRead = '', lastName = '';
function hud(p) {
  const e = expAt(p), rounded = Math.round(e), txt = Math.abs(e - rounded) < .04 ? String(rounded) : e.toFixed(1);
  const sign = txt.startsWith('-') ? '−' : '';
  const html = `10<sup>${sign}${txt.replace('-', '')}</sup> м`;
  if (html !== lastRead) { readv.innerHTML = html; lastRead = html; }
  const nm = DATA[clamp(Math.round(p), 0, N - 1)].name;
  if (nm !== lastName) { readn.textContent = 'масштаб · ' + nm; lastName = nm; }
  strip.style.transform = `translateY(${130 - (2 - e) * PX}px)`;
  prog.style.width = (clamp(p / (N - 1)) * 100).toFixed(2) + '%';
  const fr = p - Math.floor(p); const fl = (tweening && p >= 0) ? Math.pow(Math.sin(fr * Math.PI), 3) * .3 : 0;
  flash.style.opacity = fl.toFixed(3);
}

/* ================= main loop ================= */
let last = performance.now(), time = 0, prevPos = pos;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  if (tweening) {
    const p = clamp((now - t0) / dur); pos = lerp(from, to, ease(p));
    if (p >= 1) { tweening = false; pos = to; }
  }
  const speed = Math.abs(pos - prevPos) / Math.max(dt, 1e-3); prevPos = pos;
  const k = 1 - Math.exp(-dt * 4);
  mouse.x += (mouse.tx - mouse.x) * k; mouse.y += (mouse.ty - mouse.y) * k;
  cur.x += (cur.tx - cur.x) * (1 - Math.exp(-dt * 6)); cur.y += (cur.ty - cur.y) * (1 - Math.exp(-dt * 6));
  curEl.style.transform = `translate3d(${cur.x}px,${cur.y}px,0)`;

  for (let i = 0; i < N; i++) {
    const sc = scenes[i], d = pos - i;
    const op = d >= 0 ? 1 - smooth(.1, .78, d) : smooth(-1, -.35, d);
    if (op < .004 || Math.abs(d) >= 1) { if (sc.vis) { sc.el.style.visibility = 'hidden'; sc.vis = false; } continue; }
    if (!sc.vis) { sc.el.style.visibility = 'visible'; sc.vis = true; }
    const zs = d >= 0 ? Math.exp(d * 3.4) : Math.exp(d * 1.1);
    const blur = (d >= 0 ? smooth(0, .7, d) * 14 : smooth(0, .6, -d) * 9) * BLURK;
    const br = d >= 0 ? 1 + smooth(0, .6, d) * .55 : 1;
    sc.el.style.zIndex = d >= 0 ? 2 : 1;
    sc.cv.style.opacity = op.toFixed(3);
    sc.cv.style.filter = (blur > .2 || br > 1.01) ? `blur(${blur.toFixed(1)}px) brightness(${br.toFixed(2)})` : 'none';
    const a = Math.abs(d), cop = 1 - smooth(0, .32, a);
    sc.copy.style.opacity = cop.toFixed(3);
    sc.copy.style.transform = `translate3d(0,${(-d * 70).toFixed(1)}px,0) scale(${(1 + d * .16).toFixed(3)})`;
    sc.copy.style.filter = a > .02 ? `blur(${(smooth(0, .4, a) * 10).toFixed(1)}px)` : 'none';
    const ctx = sc.ctx; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
    SC[i].render(ctx, time, zs);
  }
  drawFx(speed, dt); hud(pos);
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
resize(); requestAnimationFrame(frame);
const fontsReady = (document.fonts && document.fonts.ready) ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
Promise.all([fontsReady, new Promise(r => setTimeout(r, 1500))]).then(() => {
  $('#boot').classList.add('gone');
  started = true; setActive(0);
  startTween(0, reduce ? 400 : 3200);
});
})();
</script>
</body>
</html>
